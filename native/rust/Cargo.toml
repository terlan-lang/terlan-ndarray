[package]
name = "terlan-ndarray-native"
version = "0.0.0"
edition = "2021"
publish = false
build = "build.rs"

[lints.rust]
warnings = "deny"

[lib]
path = "src/lib.rs"

[[bin]]
name = "native-boundary-helper"
path = "src/bin/native_boundary_helper.rs"

[dependencies]
base64 = "0.22.1"
getrandom = "=0.3.4"
arrow = { version = "54.3.1", default-features = false, features = ["ffi"] }
crc32fast = "1.5.0"
dyn-stack = "0.13.2"
faer = "0.24.4"
half = "2.7.1"
libc = "0.2.189"
memmap2 = "0.9.8"
ndarray = "0.17.2"
ndarray-einsum = "0.9.0"
npyz = "0.8.4"
rand = "0.9.2"
rand_chacha = "0.9.0"
rand_distr = "0.5.1"
rustfft = "6.4.1"

[build-dependencies]
cc = "=1.2.67"
pkg-config = "=0.3.33"

[workspace]

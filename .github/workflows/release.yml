name: ndarray release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x86-64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout ndarray
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: ndarray

      - name: Checkout Terlan compiler
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: terlan-lang/terlan
          ref: 0a8085a6f6e1b83b55b0900ada7e2688b0921c32
          path: terlan

      - name: Build compiler
        run: >-
          cargo build --manifest-path terlan/Cargo.toml -p terlan
          --bin terlc --bin terlan-vm

      - name: Verify native build tools
        run: command -v cc && command -v curl && command -v make && command -v pkg-config

      - name: Cache native Rust dependencies
        run: cargo fetch --manifest-path ndarray/native/rust/Cargo.toml

      - name: Run validated ndarray baseline
        run: >-
          make -C ndarray
          TERLC="$GITHUB_WORKSPACE/terlan/target/debug/terlc"
          abi-check package-check blas-check dlpack-check quality-check
